name: Rust CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-test:
    name: Format, check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxcb-xinerama0-dev libxcb-cursor-dev libxcursor-dev \
            libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format Rust sources in CI workspace
        run: cargo fmt --all

      - name: Compile all targets
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets
