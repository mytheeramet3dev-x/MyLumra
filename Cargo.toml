[package]
name = "lumra"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
typst = "0.13"
typst-render = "0.13"
typst-assets = { version = "0.13", features = ["fonts"] }
ttf-parser = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tiny-skia = "0.11"
fontdb = "0.16"
chrono = "0.4"
url = "2.5"
bytes = "1.6"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
